<div class="modal-overlay" *ngIf="visible() && digimon()" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="digivice-ring"></div>
    <div class="digivice-glow"></div>
    <button class="close-btn" (click)="onClose()">&times;</button>

    <div class="modal-header">
      <img [src]="image" [alt]="digimon()?.name" class="digimon-img" />
      <div class="header-info">
        <h2>{{ digimon()?.name }}</h2>
        <div class="tags">
          <span class="tag level" *ngFor="let level of levels">{{ level }}</span>
          <span class="tag type" *ngFor="let type of types">{{ type }}</span>
          <span class="tag attr" *ngFor="let attr of attributes">{{ attr }}</span>
        </div>
      </div>
    </div>

    <div class="modal-body">
      <h3>Descripcion</h3>
      <p>{{ description }}</p>

      <h3>Habilidades</h3>
      <ul class="skills-list">
        <li *ngFor="let skill of skills">{{ skill }}</li>
      </ul>
    </div>
  </div>
</div>
