<div class="modal-overlay" *ngIf="visible() && character()" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="doh-burst"></div>
    <button class="close-btn" (click)="onClose()">&times;</button>

    <div class="modal-header">
      <img [src]="character()?.image" [alt]="character()?.name" class="character-img" />
      <div class="header-info">
        <h2>{{ character()?.name }}</h2>
        <p class="occupation" *ngIf="character()?.occupation">{{ character()?.occupation }}</p>
      </div>
    </div>

    <div class="modal-body">
      <p class="quote">"D'oh!"</p>
    </div>
  </div>
</div>
