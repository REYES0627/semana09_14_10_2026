<div class="card" (click)="onClick()">
  <img [src]="sprite" [alt]="pokemon().name" loading="lazy" />
  <div class="card-body">
    <span class="number">#{{ pokemon().id }}</span>
    <h3>{{ pokemon().name | titlecase }}</h3>
    <div class="types">
      <span *ngFor="let type of types" class="type-badge">{{ type }}</span>
    </div>
  </div>
</div>
